<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KS Radio — Mundial 2026</title>
    <!-- hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─── HEADER ─── */
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e94560;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-mundial {
            height: 48px;
            width: auto;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(90deg, #e94560, #f5c518);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge-live {
            background: #e94560;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        .badge-live.on {
            animation: pulse 1.5s ease-in-out infinite;
        }
        .badge-live.off {
            background: #555;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ─── MAIN ─── */
        .container {
            display: flex;
            flex: 1;
            gap: 0;
        }

        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            min-width: 0;
        }

        .player-section video {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* ─── OVERLAY ─── */
        #status-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            z-index: 5;
            transition: opacity 0.6s ease;
            pointer-events: none;
            text-align: center;
            padding: 32px;
            gap: 12px;
        }
        #status-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #status-overlay.visible {
            pointer-events: auto;
        }

        #status-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #status-overlay .status-icon {
            font-size: 3rem;
            margin-bottom: 4px;
        }
        #status-overlay .status-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        #status-overlay .status-desc {
            font-size: 0.9rem;
            color: #999;
            max-width: 420px;
            line-height: 1.5;
        }

        #status-overlay .retry-btn {
            margin-top: 8px;
            padding: 10px 28px;
            border: 2px solid #e94560;
            background: transparent;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto;
        }
        #status-overlay .retry-btn:hover {
            background: #e94560;
        }
        #status-overlay .retry-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ─── TWITCH CHAT ─── */
        .chat-section {
            width: 380px;
            min-width: 320px;
            background: #18181b;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #2d2d2d;
        }

        .chat-header {
            padding: 12px 16px;
            background: #1f1f23;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .chat-header .twitch-icon {
            color: #9147ff;
            font-size: 1.2rem;
        }

        .chat-header a {
            color: #bf94ff;
            text-decoration: none;
        }
        .chat-header a:hover {
            text-decoration: underline;
        }

        .chat-section iframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .chat-section {
                width: 100%;
                min-width: unset;
                height: 420px;
                border-left: none;
                border-top: 1px solid #2d2d2d;
            }
            .player-section {
                height: calc(100vh - 420px - 80px);
            }
            header h1 {
                font-size: 1.2rem;
            }
            .logo-mundial {
                height: 36px;
            }
        }

        @media (max-width: 500px) {
            header {
                padding: 12px 16px;
            }
            header h1 {
                font-size: 1rem;
            }
            .logo-mundial {
                height: 28px;
            }
            .chat-section {
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <!-- ═══ HEADER ═══ -->
    <header>
        <div class="header-left">
            <img
                class="logo-mundial"
                src="https://upload.wikimedia.org/wikipedia/commons/5/5c/2026_FIFA_World_Cup_emblem_%28horizontal%2C_with_wordmark%29.svg"
                alt="FIFA World Cup 2026"
                onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 60%22%3E%3Crect width=%22200%22 height=%2260%22 fill=%22%231a1a2e%22/%3E%3Ctext x=%22100%22 y=%2236%22 text-anchor=%22middle%22 fill=%22%23f5c518%22 font-size=%2214%22 font-weight=%22bold%22 font-family=%22Arial%22%3EMUNDIAL 2026%3C/text%3E%3C/svg%3E'"
            />
            <h1>KS Radio</h1>
        </div>
        <span class="badge-live off" id="badgeLive">SIN SEÑAL</span>
    </header>

    <!-- ═══ CONTENIDO ═══ -->
    <div class="container">
        <!-- Player -->
        <div class="player-section">
            <video id="video" controls autoplay muted playsinline></video>

            <div id="status-overlay" class="visible">
                <div class="spinner" id="spinnerIcon"></div>
                <div class="status-icon" id="statusIcon" style="display:none"></div>
                <div class="status-title" id="statusTitle">Cargando stream...</div>
                <div class="status-desc" id="statusDesc">Conectando con el servidor</div>
                <button class="retry-btn" id="retryBtn" style="display:none">Reintentar</button>
            </div>
        </div>

        <!-- Twitch Chat -->
        <div class="chat-section">
            <div class="chat-header">
                <span class="twitch-icon">▶</span>
                Chat de Twitch —
                <a href="https://twitch.tv/ksradio" target="_blank" rel="noopener">twitch.tv/ksradio</a>
            </div>
            <iframe
                src="https://www.twitch.tv/embed/ksradio/chat?parent=localhost"
                title="Chat de Twitch - ksradio"
                allowfullscreen
            ></iframe>
        </div>
    </div>

    <!-- ═══ PLAYER SCRIPT ═══ -->
    <script>
        (function () {
            const video       = document.getElementById('video');
            const overlay     = document.getElementById('status-overlay');
            const spinnerIcon = document.getElementById('spinnerIcon');
            const statusIcon  = document.getElementById('statusIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusDesc  = document.getElementById('statusDesc');
            const retryBtn    = document.getElementById('retryBtn');
            const badgeLive   = document.getElementById('badgeLive');

            const streamUrl = 'https://live20.bozztv.com/akamaissh101/ssh101/ksradio/playlist.m3u8';

            let hls = null;
            let retryCount = 0;
            const MAX_RETRIES = 5;

            /* ─── helpers ─── */
            function setStatus(icon, title, desc, showRetry) {
                spinnerIcon.style.display = 'none';
                statusIcon.style.display = '';
                statusIcon.textContent = icon;
                statusTitle.textContent = title;
                statusDesc.textContent = desc;
                retryBtn.style.display = showRetry ? '' : 'none';
                overlay.classList.remove('hidden');
                overlay.classList.add('visible');
            }

            function setLoading(msg) {
                spinnerIcon.style.display = '';
                statusIcon.style.display = 'none';
                statusTitle.textContent = 'Conectando...';
                statusDesc.textContent = msg || 'Cargando stream';
                retryBtn.style.display = 'none';
                overlay.classList.remove('hidden');
                overlay.classList.add('visible');
            }

            function hideOverlay() {
                overlay.classList.add('hidden');
                overlay.classList.remove('visible');
                badgeLive.textContent = 'EN VIVO';
                badgeLive.className = 'badge-live on';
            }

            function setOffline(reason) {
                setStatus('📡', 'Stream fuera de línea', reason || 'El stream no está transmitiendo en este momento. Reintentando automáticamente...', true);
                badgeLive.textContent = 'SIN SEÑAL';
                badgeLive.className = 'badge-live off';
            }

            /* ─── iniciar hls.js ─── */
            function startHls() {
                if (hls) {
                    hls.destroy();
                    hls = null;
                }

                setLoading('Conectando con el servidor');

                if (!Hls.isSupported()) {
                    if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        // Safari nativo
                        video.src = streamUrl;
                        video.addEventListener('canplay', hideOverlay, { once: true });
                        video.addEventListener('playing', hideOverlay, { once: true });
                        video.addEventListener('error', function () {
                            setOffline('El reproductor nativo no pudo cargar el stream');
                        });
                        return;
                    }
                    setStatus('⚠️', 'Navegador no compatible', 'Tu navegador no soporta reproducción HLS. Probá con Chrome, Firefox o Edge.', false);
                    return;
                }

                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    manifestLoadingTimeOut: 10000,
                    levelLoadingTimeOut: 10000,
                    fragLoadingTimeOut: 10000,
                });

                hls.loadSource(streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    setLoading('Stream encontrado, conectando...');
                    video.play().catch(() => {});
                });

                video.addEventListener('canplay', hideOverlay, { once: true });
                video.addEventListener('playing', hideOverlay, { once: true });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: {
                                retryCount++;
                                const detail = data.response ? data.response.code : '';
                                if (detail === 502 || detail === 503) {
                                    setOffline(
                                        (retryCount <= MAX_RETRIES)
                                            ? 'El servidor reporta que el stream no está activo. Reintentando...'
                                            : 'El stream sigue sin señal después de varios intentos. Hacé clic en Reintentar para probar de nuevo.'
                                    );
                                } else {
                                    setStatus('🌐', 'Error de red' + (detail ? ' (' + detail + ')' : ''), 'Reintentando en unos segundos...', retryCount > MAX_RETRIES);
                                }

                                if (retryCount <= MAX_RETRIES) {
                                    setTimeout(() => { hls.startLoad(); }, 4000);
                                }
                                break;
                            }
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                setStatus('🔄', 'Error de reproducción', 'Recuperando...');
                                setTimeout(() => { hls.recoverMediaError(); }, 2000);
                                break;
                            default:
                                setOffline('Error desconocido al cargar el stream');
                                break;
                        }
                    }
                });
            }

            /* ─── reintento manual ─── */
            retryBtn.addEventListener('click', function () {
                retryCount = 0;
                startHls();
            });

            /* ─── arranque ─── */
            startHls();

            // Timeout de seguridad: si tras 20s no hay reproducción
            // pero NO ocultamos el overlay, solo cambiamos el mensaje
            setTimeout(function () {
                if (!overlay.classList.contains('hidden') && statusTitle.textContent === 'Conectando...') {
                    setOffline('El stream no responde. Puede que no esté al aire.');
                }
            }, 20000);

        })();
    </script>

</body>
</html>
