<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Comunicado Oficial - Konata Station | AMEC Co. Ltd.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Georgia', 'Times New Roman', serif;
            background-color: #e9ecef;
            padding: 2rem 1rem;
            color: #212529;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 1px solid #dee2e6;
        }

        /* Encabezado institucional */
        .header {
            background-color: #1a2a3a;
            color: white;
            padding: 1.8rem 2rem;
            border-bottom: 4px solid #d4af37;
        }

        .header h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .header h2 {
            font-size: 1rem;
            font-weight: 400;
            margin-top: 0.5rem;
            opacity: 0.85;
            font-family: 'Segoe UI', sans-serif;
        }

        .header .company {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 0.6rem;
            display: inline-block;
        }

        /* contenido principal */
        .content {
            padding: 2rem 2rem 1.8rem 2rem;
        }

        .document-image {
            text-align: center;
            margin-bottom: 2rem;
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #e2e6ea;
        }

        .document-image img {
            max-width: 100%;
            height: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            border: 1px solid #ced4da;
            transition: transform 0.2s ease;
        }

        .document-image img:hover {
            transform: scale(1.01);
        }

        .caption {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: #6c757d;
            font-style: italic;
        }

        .info-box {
            background-color: #f1f3f5;
            border-left: 5px solid #d4af37;
            padding: 1.2rem 1.5rem;
            margin: 1.8rem 0;
            border-radius: 8px;
        }

        .info-box p {
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .info-box strong {
            color: #1a2a3a;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.85rem;
            text-align: center;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
            padding-top: 1.5rem;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #1a2a3a;
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-family: sans-serif;
            transition: background 0.2s;
            margin-top: 0.5rem;
            border: none;
            cursor: pointer;
        }

        .btn-download:hover {
            background-color: #0f1c28;
        }

        @media (max-width: 680px) {
            .content {
                padding: 1.5rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Konata Station</h1>
        <h2>Comunicados oficiales · Transparencia institucional</h2>
    </div>

    <div class="content">

        <div class="document-image">
            <img src="https://i.postimg.cc/xjXCkkHp/COM-D-CIRC-28-05-27-324.jpg" 
                 alt="Comunicado oficial: Cese del Archivo de Locutores - Konata Station"
                 id="documentoImg">
        </div>
        </div>
    </div>
</div>

<script>
    
    const imagen = document.getElementById('documentoImg');
    const botonDescarga = document.getElementById('downloadLink');
    
    
    if (imagen && botonDescarga) {
        
        const urlImagenReal = imagen.src;
        
        botonDescarga.href = urlImagenReal;
        botonDescarga.setAttribute('download', 'Comunicado_Konata_20260528.jpg');
    }
</script>

</body>
</html>
